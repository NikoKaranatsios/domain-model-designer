name: Check public content and editor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-public-content.cjs
      - run: node scripts/build.cjs --check
      - run: node --test tests/*.test.cjs
      - run: node scripts/security-policy.cjs
